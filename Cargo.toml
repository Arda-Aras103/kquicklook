[package]
name = "kquicklook"
version = "0.2.0"
edition = "2021"
description = "Ultra-lightweight macOS QuickLook clone for KDE Plasma written in Rust"
authors = ["Arda Aras"]
repository = "https://github.com/Arda-Aras103/kquicklook"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tiff",
] }
resvg = { version = "0.43", default-features = false }
# Embedded syntaxes/themes only + pure Rust regex (no yaml/plist/html loaders)
syntect = { version = "5.2", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
serde_json = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = "1.0"

[profile.release]
opt-level = "s"       # Optimize for size while remaining significantly faster than "z"
lto = true            # Strip dead code via Link-Time Optimization
codegen-units = 1     # Maximum optimization
panic = "abort"       # Reduce binary size by removing unwind tables
strip = true          # Automatically strip debug symbols
