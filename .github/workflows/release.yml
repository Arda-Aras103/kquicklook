name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-fedora:
    name: Build & Publish Release (Fedora x86_64)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Fedora dependencies
        run: |
          dnf install -y gcc cargo rust fontconfig google-noto-sans-vf-fonts tar gzip rpm gh

      - uses: actions/checkout@v4

      - name: Build optimized release binary
        run: cargo build --release

      - name: Package release archive & SHA256 checksum
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          STAGE="kquicklook-${TAG}-fedora-x86_64"
          mkdir -p "${STAGE}"
          cp target/release/kquicklook "${STAGE}/"
          cp install.sh README.md LICENSE "${STAGE}/"
          cp -r kde "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          cp target/release/kquicklook kquicklook-linux-x86_64
          sha256sum "${STAGE}.tar.gz" kquicklook-linux-x86_64 > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              kquicklook-*-fedora-x86_64.tar.gz \
              kquicklook-linux-x86_64 \
              SHA256SUMS.txt \
              --title "KQuickLook ${TAG}" \
              --generate-notes
